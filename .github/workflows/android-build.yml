name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # sadece Release yayınlamak için (gh release create)
    env:
      # İki secret da tanımlıysa her build aynı kalıcı anahtarla imzalanır (bkz. app/build.gradle.kts).
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.SIGNING_PASSWORD != '' }}
      # main'e her push yeni bir sürüm yayınlar; uygulama içi güncelleyici "latest" release'i okur.
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sürüm notları için önceki release etiketine kadar olan commit'ler lazım

      - name: Refuse to publish an unstable-signed release
        if: env.IS_RELEASE == 'true' && env.HAS_SIGNING != 'true'
        run: |
          echo "::error title=İmza anahtarı eksik::Release yayınlamak için SIGNING_KEYSTORE_BASE64 ve SIGNING_PASSWORD secret'ları gerekli. Geçici anahtarla imzalanmış bir sürüm yayınlanırsa kullanıcılar onu güncelleme olarak kuramaz."
          exit 1

      - name: Warn about unstable signature
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning title=İmza anahtarı yok::SIGNING_KEYSTORE_BASE64 / SIGNING_PASSWORD secret'ları tanımlı değil. Bu APK geçici bir anahtarla imzalandı; kurulu sürümün üzerine güncelleme olarak yüklenemez."

      - name: Decode signing keystore
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint and assemble release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew lintDebug assembleRelease --no-daemon

      - name: Name the APK after its version
        run: |
          VERSION_BASE=$(grep '^appVersionBase=' gradle.properties | cut -d= -f2)
          VERSION_NAME="$VERSION_BASE.${{ github.run_number }}"
          APK_PATH="$RUNNER_TEMP/CanliAgTrafigi-v$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CanliAgTrafigi-v${{ env.VERSION_NAME }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then RANGE="$PREVIOUS_TAG..HEAD"; else RANGE="-20"; fi
          {
            echo "## Değişiklikler"
            git log $RANGE --no-merges --pretty='- %s' | head -40
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Canlı Ağ Trafiği $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
